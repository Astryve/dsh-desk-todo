<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>桌面挂件</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="mode-m">
  <div id="app">
    <header class="bar" data-hit>
      <div class="title" id="weekLabel">本周</div>
      <div class="tools">
        <button id="btnAdd" class="chip" title="新增待办（右键=新增长期任务）">＋</button>
        <button id="btnView" class="chip" title="切换 本周 / 长期">长期</button>
        <button id="btnCfg" class="chip" title="设置">⚙</button>
        <button id="btnHide" class="chip" title="隐藏">－</button>
      </div>
    </header>

    <main class="panes">
      <section id="paneWeek" class="pane">
        <div id="weekList" class="list"></div>
      </section>
      <div class="divider"></div>
      <section id="paneLong" class="pane">
        <div id="longList" class="list"></div>
      </section>
    </main>
  </div>

  <div id="detail" class="overlay hidden" data-hit>
    <div class="card">
      <div class="card-top">
        <span id="dTitle" class="card-title"></span>
        <button id="dClose" class="x">×</button>
      </div>
      <div id="dMeta" class="meta"></div>
      <label class="lbl">我的备注</label>
      <textarea id="dNote" rows="3" placeholder="写点备注…（自动保存）"></textarea>
      <div class="card-actions">
        <button id="dDone" class="btn">标记完成</button>
        <button id="dEdit" class="btn ghost">编辑</button>
        <button id="dDel" class="btn ghost">删除</button>
        <button id="dOpenData" class="btn ghost">数据</button>
      </div>
    </div>
  </div>

  <div id="editor" class="overlay hidden" data-hit>
    <div class="card">
      <div class="card-top">
        <span id="eKind" class="card-title">新增待办</span>
        <button id="eCancel2" class="x">×</button>
      </div>
      <label class="lbl">标题</label>
      <input id="eTitle" type="text" placeholder="例如 交作业 / 数值分析" />
      <div class="only-event">
        <div class="row2">
          <label class="lbl">日期 <input id="eDate" type="date" /></label>
          <label class="lbl">开始
            <span class="timebox">
              <button type="button" id="eStartH" class="tm" data-unit="hour">08</button><span class="colon">:</span><button type="button" id="eStartM" class="tm" data-unit="min">00</button>
            </span>
          </label>
          <label class="lbl">结束
            <span class="timebox">
              <button type="button" id="eEndH" class="tm" data-unit="hour">09</button><span class="colon">:</span><button type="button" id="eEndM" class="tm" data-unit="min">35</button>
            </span>
          </label>
        </div>
        <div class="row2">
          <label class="lbl">地点 <input id="ePlace" type="text" placeholder="东区414" /></label>
          <label class="lbl">提前(分钟) <input id="eRemind" type="number" min="0" max="180" step="5" /></label>
          <label class="lbl">重复
            <select id="eRepeat">
              <option value="none">只一次</option>
              <option value="weekly">每周</option>
            </select>
          </label>
        </div>
      </div>
      <div class="only-long">
        <label class="lbl">截止日期 <input id="eDue" type="date" /></label>
      </div>
      <label class="lbl">备注（可粘贴「几号几点在哪做什么」，点右侧识别）</label>
      <textarea id="eNote" rows="2"></textarea>
      <div class="parse-row">
        <span id="eHint" class="hint"></span>
        <button id="eParse" class="btn ghost small" title="从备注里识别时间地点并填入">识别</button>
      </div>
      <div class="card-actions">
        <button id="eSave" class="btn">保存</button>
        <button id="eCancel" class="btn ghost">取消</button>
        <button id="eDelete" class="btn ghost">删除</button>
      </div>
    </div>
  </div>

  <div id="cfg" class="overlay hidden" data-hit>
    <div class="card">
      <div class="card-top">
        <span class="card-title">设置</span>
        <button id="cClose" class="x">×</button>
      </div>
      <label class="lbl">尺寸预设</label>
      <div class="presets">
        <button class="btn ghost" data-preset="400x220">400×220</button>
        <button class="btn ghost" data-preset="520x330">520×330</button>
        <button class="btn ghost" data-preset="640x400">640×400</button>
        <button class="btn ghost" data-preset="760x460">760×460</button>
      </div>
      <div class="row2">
        <label class="lbl">宽 <input id="cW" type="number" min="300" max="960" step="10"></label>
        <label class="lbl">高 <input id="cH" type="number" min="140" max="680" step="10"></label>
      </div>
      <label class="lbl">背景不透明度 <span id="cOpV"></span></label>
      <input id="cOpacity" type="range" min="0.3" max="0.95" step="0.01">
      <div class="card-actions">
        <button id="cApply" class="btn">应用</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
